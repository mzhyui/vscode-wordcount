<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
	<!-- Word Count (Local) icon: a highlighted selection over lines of text, counted off as a tally. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#7C3AED"/>
			<stop offset="1" stop-color="#DB2777"/>
		</linearGradient>
	</defs>
	<rect width="128" height="128" rx="28" fill="url(#bg)"/>

	<!-- Lines of text -->
	<g fill="#FFFFFF" fill-opacity="0.55">
		<rect x="22" y="22" width="84" height="8" rx="4"/>
		<rect x="22" y="40" width="16" height="8" rx="4"/>
		<rect x="22" y="58" width="58" height="8" rx="4"/>
	</g>

	<!-- Selected words with the text cursor at the end of the selection -->
	<rect x="42" y="35" width="50" height="18" rx="4" fill="#FACC15"/>
	<rect x="46" y="40" width="42" height="8" rx="4" fill="#5B21B6"/>
	<g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
		<path d="M97 32 V56"/>
		<path d="M93 32 H101 M93 56 H101"/>
	</g>

	<!-- Tally of five -->
	<g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
		<path d="M38 80 V106"/>
		<path d="M52 80 V106"/>
		<path d="M66 80 V106"/>
		<path d="M80 80 V106"/>
	</g>
	<path d="M28 101 L92 85" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
</svg>
